[package]
name = "{{.Inputs.project_name.Value}}"
version = "0.1.0"
edition = "2024"
rust-version = "{{.Inputs.rust_version.Value}}"
description = "{{if eq .Inputs.project_type.Value "cli"}}A command line application{{else}}A web service{{end}}"
repository = "https://github.com/{{.Inputs.owner.Value}}/{{.Inputs.project_name.Value}}"
publish = false

[dependencies]
anyhow = "1.0.104"
{{- if eq .Inputs.project_type.Value "cli"}}
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
{{- else}}
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }
{{- end}}

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
